[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q2pdfcomposer"
version = "0.0.6"
description = "PDF Composer"
readme = "README.md"
authors = [
    { name = "Andrei Puchko" }
]
requires-python = ">=3.9"
dependencies = [
    "pymupdf",
    "qtpy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["q2pdfcomposer*"]
exclude = ["datasets", "tests"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
